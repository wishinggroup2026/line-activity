<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>願望池・個人活動中心</title>
<meta name="description" content="願望池活動報名平台——查看你的報名紀錄與主辦的活動">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23E2634C'/%3E%3Cg fill='%23FFF6EA'%3E%3Cellipse cx='18' cy='10.4' rx='3.4' ry='5'/%3E%3Cellipse cx='18' cy='25.6' rx='3.4' ry='5'/%3E%3Cellipse cx='10.4' cy='18' rx='5' ry='3.4'/%3E%3Cellipse cx='25.6' cy='18' rx='5' ry='3.4'/%3E%3Ccircle cx='18' cy='18' r='2.4' fill='%23E2634C'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ===== 個人活動中心（頁面專屬樣式） ===== */
.user-menu[hidden] { display: none; } /* 確保 hidden 屬性優先於 .user-menu 的 display:flex */
.center-zone { padding: 20px 0 30px; }
.stat-strip[hidden], .center-tabs[hidden] { display: none; }
.center-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px 14px; flex-wrap: wrap; max-width: 860px; margin-bottom: 18px;
}
.sub-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sub-chips .chip { padding: 6px 14px; font-size: 13px; }
.toolbar-note { color: var(--ink-3); font-size: 13px; flex: none; }
.mreg-item .thumb-wrap { flex: none; display: block; border-radius: 12px; overflow: hidden; }
.mreg-item.is-dim { opacity: .68; transition: opacity .15s; }
.mreg-item.is-dim:hover { opacity: 1; }
.mreg-side .status { white-space: nowrap; }
.mreg-side .status.r-pill.s-cancelled { text-decoration: none; }
.guest-empty { padding: 90px 20px 60px; }
@media (max-width: 720px) {
  .mreg-item .thumb-wrap { width: 100%; }
  .center-toolbar .btn { margin-left: auto; }
}
</style>
</head>
<body data-reload-on-auth="1">

<header id="site-head" class="site-head"></header>

<main>
  <section class="page-head container">
    <span class="eyebrow">My Center</span>
    <h1>個人活動中心</h1>
    <p class="sub" id="head-sub">登入後即可查看你的報名紀錄與主辦的活動。</p>
  </section>

  <section class="container center-zone">
    <div class="stat-strip" id="stat-strip" hidden></div>
    <div class="center-tabs" id="center-tabs" hidden></div>
    <div id="center-body"></div>
  </section>
</main>

<footer id="site-foot" class="site-foot"></footer>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/my.js"></script>
</body>
</html>
