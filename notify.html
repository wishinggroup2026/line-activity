<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>願望池・通知中心</title>
<meta name="description" content="願望池活動報名平台——報名、候補、異動與活動提醒都集中在這裡">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23E2634C'/%3E%3Cg fill='%23FFF6EA'%3E%3Cellipse cx='18' cy='10.4' rx='3.4' ry='5'/%3E%3Cellipse cx='18' cy='25.6' rx='3.4' ry='5'/%3E%3Cellipse cx='10.4' cy='18' rx='5' ry='3.4'/%3E%3Cellipse cx='25.6' cy='18' rx='5' ry='3.4'/%3E%3Ccircle cx='18' cy='18' r='2.4' fill='%23E2634C'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ============ 通知中心（頁面專屬） ============ */
.nh-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px 20px; flex-wrap: wrap; max-width: 720px;
}
.notify-zone { padding: 24px 0 10px; }
#mark-all[hidden] { display: none; }
.user-menu[hidden] { display: none; } /* 補強：hidden 不被 .user-menu 的 display 蓋掉 */
.notif-go { color: var(--ink-3); align-self: center; flex: none; transition: .15s; }
.notif-item:hover .notif-go { color: var(--red-deep); }
.set-group {
  font-size: 12px; font-weight: 800; letter-spacing: 2.5px;
  color: var(--ink-3); margin: 22px 0 2px;
}
.form-head + .set-group { margin-top: 0; }
.set-note {
  display: flex; align-items: flex-start; gap: 7px;
  margin-top: 14px; font-size: 12.5px; color: var(--ink-3);
}
.set-note .ic { margin-top: 2px; }

/* --- 分區：進行中 / 已結束（收合） --- */
.notif-live { display: flex; flex-direction: column; gap: 12px; }
.notif-group {
  font-size: 12px; font-weight: 800; letter-spacing: 2.5px;
  color: var(--ink-3); margin: 2px 0 -2px;
}
.notif-none { font-size: 13.5px; color: var(--ink-3); padding: 2px 0 4px; }

.past-block { margin-top: 4px; }
.past-bar {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; font: inherit; text-align: left; cursor: pointer;
  background: var(--bg-soft); color: var(--ink-2);
  border: 1px dashed var(--line); border-radius: var(--radius-sm); transition: .15s;
}
.past-bar:hover { border-color: var(--ink-3); color: var(--ink); }
.past-chev { display: inline-flex; flex: none; color: var(--ink-3); transition: transform .18s; }
.past-bar[aria-expanded="true"] .past-chev { transform: rotate(90deg); }
.past-lab { font-size: 14px; font-weight: 700; }
.past-count { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.past-unread {
  flex: none; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  background: var(--red-soft); color: var(--red-deep);
}
.past-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.past-list[hidden] { display: none; }
.past-more { align-self: flex-start; margin-top: 2px; }

/* 已結束通知：淡化、單行摘要 */
.notif-item.is-past { padding: 11px 14px; align-items: center; background: transparent; opacity: .82; }
.notif-item.is-past:hover { opacity: 1; }
.notif-item.is-past .notif-ic { width: 30px; height: 30px; }
.notif-item.is-past .notif-ic .ic { width: 17px; height: 17px; }
.notif-item.is-past .notif-main { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; }
.notif-item.is-past .notif-main h4 { font-size: 13.5px; font-weight: 600; flex: none; }
.notif-item.is-past .notif-main p {
  flex: 1 1 180px; min-width: 0; margin-top: 0; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.notif-item.is-past .notif-main time { flex: none; margin-top: 0; }
@media (max-width: 560px) {
  .past-count { margin-left: 0; }
  .past-lab { flex: 1; }
}
</style>
</head>
<body data-reload-on-auth="1">

<header id="site-head" class="site-head"></header>

<main>
  <section class="page-head container">
    <span class="eyebrow">Notifications</span>
    <div class="nh-row">
      <div>
        <h1>通知中心</h1>
        <p class="sub" id="notif-sub"></p>
      </div>
      <button class="btn btn-light" id="mark-all" hidden></button>
    </div>
  </section>

  <section class="notify-zone container">
    <div class="notif-list" id="notif-list"></div>
    <div id="settings-host"></div>
  </section>
</main>

<footer id="site-foot" class="site-foot"></footer>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/notify.js"></script>
</body>
</html>
